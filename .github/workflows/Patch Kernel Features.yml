name: Patch Kernel Features

on:
  workflow_dispatch:
    inputs:
      root_flavor:
        description: 'Root Implementations'
        required: true
        type: choice
        options:
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'ReSukiSU'
      susfs:
        description: 'susfs4ksu - root hiding (Ptrace & Unicode Fix)'
        type: boolean
        default: true
      nomount:
        description: 'NoMount / Mountify - mount metamodules'
        type: boolean
        default: true
      baseband_guard:
        description: 'Baseband Guard - partition protection'
        type: boolean
        default: false
      networking:
        description: 'Networking - WireGuard, BBR, IPSet, CIFS'
        type: boolean
        default: false
      tmpfs:
        description: 'TMPFS - xattr / POSIX ACLs'
        type: boolean
        default: false
      bpf:
        description: 'BPF - BTF / eBPF / FUSE-BPF'
        type: boolean
        default: false
      performance:
        description: 'Performance - incl. NTSync'
        type: boolean
        default: false
      droidspaces:
        description: 'DroidSpaces - container runtime'
        type: boolean
        default: false

jobs:
  patch-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel Rothko
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: bsp-rothko-u-oss

      - name: Tampilkan Pilihan Fitur
        run: |
          echo "Mempersiapkan patch berdasarkan pilihan:"
          echo "Root: ${{ github.event.inputs.root_flavor }}"
          echo "SusFS: ${{ github.event.inputs.susfs }}"
          echo "NoMount: ${{ github.event.inputs.nomount }}"

          
          
      - name: Setup KernelSU-Next
        if: ${{ github.event.inputs.root_flavor == 'KernelSU-Next' }}
        run: |
          echo "Memasang KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Setup KernelSU (Resmi)
        if: ${{ github.event.inputs.root_flavor == 'KernelSU' }}
        run: |
          echo "Memasang KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Setup ReSukiSU
        if: ${{ github.event.inputs.root_flavor == 'ReSukiSU' }}
        run: |
          echo "Memasang ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/backslashxx/ReSukiSU/main/kernel/setup.sh" | bash -


                - name: Setup SusFS (Root Hiding, Ptrace, Unicode Fix)
        if: ${{ github.event.inputs.susfs == 'true' }}
        run: |
          echo "Mengkloning repositori SusFS..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1

          echo "Menyalin file SusFS ke direktori kernel..."
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/

          echo "Menerapkan patch utama SusFS ke kernel 6.1..."
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-6.1.patch

          echo "Menerapkan hook SusFS ke modul Root..."
          # Karena pengguna bisa memilih KSUN, KSU, atau ReSukiSU, kita gunakan deteksi folder dinamis
          if [ -d "KernelSU-Next" ]; then
            cd KernelSU-Next
          elif [ -d "KernelSU" ]; then
            cd KernelSU
          else
            echo "Folder root tidak ditemukan!"
            exit 1
          fi
          
          patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..
          
